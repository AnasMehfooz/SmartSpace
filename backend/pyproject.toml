[project]
name = "smartspace-backend"
version = "0.1.0"
description = "SMART SPACE - local-first AI file manager: FastAPI backend sidecar"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "lancedb>=0.13",
    "pyarrow>=16",
    "numpy>=1.26",
    "fastembed>=0.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "charset-normalizer>=3.3",
    "pillow>=10.3",
    "rapidocr-onnxruntime>=1.3",
    "lingua-language-detector>=2.0",
    "watchdog>=4.0",
    "xxhash>=3.4",
    "psutil>=5.9",
    "py-cpuinfo>=9.0",
    "nvidia-ml-py>=12.535",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
log_level = "WARNING"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
